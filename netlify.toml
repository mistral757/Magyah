# ─────────────────────────────────────────────────────────────────────────────
#  MAGYAH — Netlify
#
#  MIÉRT VAN EGYÁLTALÁN EZ A FÁJL. Eddig nem volt rá szükség: a Netlify a
#  repó gyökerét publikálta, és kész. A P2b (értesítés) viszont behozott egy
#  package.json-t a web-push miatt — és a Netlify egy package.json láttán
#  MAGÁTÓL build-lépést keresne. Ez a fájl kimondja, hogy nincs build: a
#  gyökér megy ki, változatlanul, ahogy eddig.
# ─────────────────────────────────────────────────────────────────────────────
[build]
  command = ""
  publish = "."
  functions = "netlify/functions"
