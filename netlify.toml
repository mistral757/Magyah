# ─────────────────────────────────────────────────────────────────────────────
#  MAGYAH — Netlify
#
#  EBBEN A FÁJLBAN SZÁNDÉKOSAN NINCS [build] SZAKASZ.
#
#  Az első változata volt benne — `command = ""` és `publish = "."` —, és a
#  deploy 11 másodperc alatt elhasalt. Az ok: a publikálási könyvtár így
#  KIMONDVA azonos lett a projekt gyökerével, és a Netlify ezt a párost
#  konfigurációs hibaként utasítja vissza. Amíg nem volt netlify.toml, a
#  Netlify a felületen mentett beállításokból dolgozott, és minden működött —
#  a „védelemnek” szánt fájl maga rontotta el.
#
#  Amit ez a fájl mond, az tehát MINDÖSSZE annyi, hol vannak a függvények —
#  és még ez is csak kimondja az alapértelmezést, hogy egy felületi
#  átállítás se vihesse el észrevétlenül.
#
#  A BUILD-RŐL: nem kell letiltani. A Netlify nem talál ki magának build-
#  parancsot egy package.json láttán; a mentett (üres) beállítás marad
#  érvényben. A package.json csak arra kell, hogy a függvény web-push
#  függősége települjön — és a package-lock.json miatt determinisztikusan.
# ─────────────────────────────────────────────────────────────────────────────
[functions]
  directory = "netlify/functions"
