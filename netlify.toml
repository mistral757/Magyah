# ─────────────────────────────────────────────────────────────────────────────
#  MAGYAH — Netlify
#
#  EZ A FÁJL EGYETLEN DOLGOT CSINÁL: kivesz EGY nyilvános értéket a Netlify
#  titok-szkennerének heurisztikájából. Se build-parancs, se publikálási
#  könyvtár nincs benne — azok a felületen mentett beállításból jönnek, és
#  onnan is kell jönniük.
#
#  MI TÖRTÉNT. A P2b behozott egy package.json-t (a függvény web-push
#  függősége miatt). A Netlify ettől kezdve FUTTAT egy buildet — előtte nem
#  volt mit —, a build pedig titok-szkennelést is végez. A szkenner az
#  index.html-ben megtalálta a Firebase `apiKey`-t („AIza…"), és megállította
#  a deployt. Nem a package.json rossz, nem a függvény: a naplóban a
#  telepítés (17 csomag) és a becsomagolás is hibátlanul lefutott.
#
#  AZ apiKey NEM TITOK. Nyilvános kliens-azonosító; a Firebase kifejezetten
#  arra tervezte, hogy a kliens kódjában legyen. A hozzáférést az RTDB
#  szabályai döntik el (tools/firebase-rules.json), nem a kulcs ismerete.
#  Ugyanez a mondat ott áll az index.html-ben is, a konfiguráció fölött.
#
#  MIÉRT NEM KAPCSOLJUK KI AZ EGÉSZ SZKENNERT. Mert pont most lett rá a
#  legnagyobb szükség: a P2b óta létezik egy VALÓDI titok (VAPID_PRIVATE),
#  aminek soha nem szabad a repóba kerülnie. A szkenner a környezeti
#  változók értékeit is keresi a kimenetben — ha az a kulcs valaha
#  beleszivárogna az index.html-be, EZ állítaná meg a deployt.
#  Ezért itt CSAK EZT AZ EGY, bizonyítottan nyilvános értéket vesszük ki a
#  heurisztikából. Minden más őr a helyén marad.
# ─────────────────────────────────────────────────────────────────────────────
