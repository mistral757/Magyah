<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<!-- ═══ A PLAY FUNKCIÓGRAFIKÁJA — 1024×500 ═══
     A Play Console egyetlen kötelező grafikai eleme, amit nem lehet a
     játékból kifényképezni. Ez a lap ELŐÁLLÍTJA: a játék saját betűivel
     (/fonts), saját színeivel és saját ikonjával — tehát nem egy külső
     eszközben rajzolt kép, ami az első arculatváltásnál elavul.
     Renderelés: node tools/grafika/render.js → icons/play/feature-1024x500.png

     HÁROM SZABÁLY, AMI A PLAY MIATT VAN:
       · NINCS apró szöveg — a Play kicsinyítve is mutatja;
       · NINCS képernyőkép-keret (telefonváz) — ezt kifogásolják;
       · a lényeg a KÖZÉPSŐ sávban van: a levágás a széleket viheti el. -->
<style>
@font-face{font-family:"Anton";src:url("../../fonts/anton-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-024F,U+0259,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF;font-display:block}
@font-face{font-family:"Anton";src:url("../../fonts/anton-latin.woff2") format("woff2");font-display:block}
@font-face{font-family:"Archivo";src:url("../../fonts/archivo-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-024F,U+0259,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF;font-display:block}
@font-face{font-family:"Archivo";src:url("../../fonts/archivo-latin.woff2") format("woff2");font-display:block}
@font-face{font-family:"ArchivoBlack";src:url("../../fonts/archivo-black-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-024F,U+0259,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF;font-display:block}
@font-face{font-family:"ArchivoBlack";src:url("../../fonts/archivo-black-latin.woff2") format("woff2");font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
.g{position:relative;width:1024px;height:500px;
  background:
    radial-gradient(120% 130% at 78% 18%, rgba(226,196,120,.20) 0%, transparent 55%),
    radial-gradient(90% 120% at 8% 92%, rgba(47,107,66,.28) 0%, transparent 60%),
    linear-gradient(118deg,#12100c 0%,#1b1812 46%,#241f16 100%)}
/* A pálya vonalai — halványan, hogy a képnek legyen tárgya, de ne rajzoljon zajt. */
.p{position:absolute;inset:0;opacity:.13;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 2px, transparent 2px 116px);
  mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.kor{position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;
  border:2px solid rgba(255,255,255,.10);border-radius:50%}
.tart{position:absolute;inset:0;display:flex;align-items:center;gap:44px;padding:0 60px 0 72px}
.ikon{flex:none;width:184px;height:184px;border-radius:42px;overflow:hidden;
  box-shadow:0 18px 46px rgba(0,0,0,.62), 0 0 0 3px rgba(226,196,120,.34)}
.ikon img{width:100%;height:100%;display:block}
.tx{flex:1;min-width:0}
.cim{font-family:"Anton",Impact,sans-serif;font-size:104px;line-height:.92;
  letter-spacing:.012em;color:#f2ead6;
  text-shadow:0 5px 0 rgba(0,0,0,.34), 0 20px 42px rgba(0,0,0,.55)}
.vonal{width:132px;height:5px;margin:20px 0 18px;border-radius:99px;
  background:linear-gradient(90deg,#e2c478,#2f6b42)}
/* A TÖRÉS KÉZI: a két sor egy-egy teljes gondolat. A `nowrap` sorokkal a
   böngésző nem tud rossz helyen tördelni — egy „pörögj / fel!" törés a kép
   egyetlen mondatát vágná ketté. A méret ehhez van igazítva, nem fordítva. */
.alcim{font-family:"ArchivoBlack",Arial,sans-serif;font-size:26px;line-height:1.34;
  color:#e6dcc4;letter-spacing:.003em}
.alcim span{display:block;white-space:nowrap}
.alcim b{color:#e2c478}
.also{position:absolute;left:76px;bottom:34px;display:flex;gap:26px;
  font-family:"Archivo",Arial,sans-serif;font-size:20px;letter-spacing:.055em;
  text-transform:uppercase;color:#a89a80}
.also span{display:flex;align-items:center;gap:9px}
.also i{width:9px;height:9px;border-radius:50%;background:#2f6b42;font-style:normal;flex:none}
.also span:nth-child(2) i{background:#e2c478}
.also span:nth-child(3) i{background:#8c6ab4}
</style></head>
<body>
<div class="g">
  <div class="p"></div><div class="kor"></div>
  <div class="tart">
    <div class="ikon"><img src="../../icons/icon-512x512.png" alt=""></div>
    <div class="tx">
      <div class="cim">MAGYAH</div>
      <div class="vonal"></div>
      <div class="alcim"><span>Építsd a saját <b>magyah</b> csapatod, pörögj fel!</span><span>Vár a <b>mennyei megyei</b> edzők világa.</span></div>
    </div>
  </div>
  <div class="also">
    <span><i></i>Hat osztály</span>
    <span><i></i>Harminc forduló</span>
    <span><i></i>Offline is</span>
  </div>
</div>
</body></html>
