<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<!-- ═══ A PLAY FUNKCIÓGRAFIKÁJA — 1024×500 ═══
     A Play Console egyetlen kötelező grafikai eleme, amit nem lehet a
     játékból kifényképezni. Ez a lap ELŐÁLLÍTJA: a játék saját betűivel
     (/fonts), saját színeivel és saját ikonjával — tehát nem egy külső
     eszközben rajzolt kép, ami az első arculatváltásnál elavul.
     Renderelés: node tools/grafika/render.js → icons/play/feature-1024x500.png

     1.0.11.2.01: AZ ÚJ ARCULAT. A Reflektor téma (esti rangadó, élő
     közvetítés) és a taktikai M ikon: petróleum-éjszaka, két reflektorkúp,
     a pálya vonalai, a cím ferde közvetítés-sávon, Exo 2. A szöveg a régi.

     HÁROM SZABÁLY, AMI A PLAY MIATT VAN:
       · NINCS apró szöveg — a Play kicsinyítve is mutatja;
       · NINCS képernyőkép-keret (telefonváz) — ezt kifogásolják;
       · a lényeg a KÖZÉPSŐ sávban van: a levágás a széleket viheti el. -->
<style>
@font-face{font-family:"Exo2Cim";src:url("../../fonts/exo-2-cim-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-017F,U+0218-021B,U+2020,U+2113;font-display:block}
@font-face{font-family:"Exo2Cim";src:url("../../fonts/exo-2-cim-latin.woff2") format("woff2");font-display:block}
@font-face{font-family:"Exo2";font-weight:400 800;src:url("../../fonts/exo-2-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F;font-display:block}
@font-face{font-family:"Exo2";font-weight:400 800;src:url("../../fonts/exo-2-latin.woff2") format("woff2");font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
.g{position:relative;width:1024px;height:500px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 120%,#0d3a2c 0%,#082029 48%,#030c10 100%)}
/* a két reflektorkúp */
.kup{position:absolute;top:-10px;width:900px;height:620px;mix-blend-mode:screen}
.kup.b{left:-260px;clip-path:polygon(30% 0,34% 0,92% 100%,40% 100%);
  background:linear-gradient(180deg,rgba(190,245,255,.30),rgba(190,245,255,0) 80%)}
.kup.j{right:-260px;clip-path:polygon(66% 0,70% 0,60% 100%,8% 100%);
  background:linear-gradient(180deg,rgba(226,255,150,.20),rgba(226,255,150,0) 80%)}
.lamp{position:absolute;top:18px;display:flex;gap:6px;padding:7px;background:#0d1d24;border:1px solid #23414d;border-radius:4px}
.lamp i{width:18px;height:12px;border-radius:2px;background:#f4fffb;box-shadow:0 0 12px 3px rgba(200,250,255,.8)}
.lamp.b{left:40px}.lamp.j{right:40px}
/* a pálya a háttérben, perspektívában */
.gyep{position:absolute;left:50%;bottom:-150px;width:1300px;transform:translateX(-50%) perspective(700px) rotateX(60deg);transform-origin:50% 100%;opacity:.55}
.gyep svg{display:block;width:100%}
.tart{position:absolute;inset:0;display:flex;align-items:center;gap:46px;padding:0 64px 40px 82px}
.ikon{flex:none;width:196px;height:196px;border-radius:44px;overflow:hidden;
  box-shadow:0 22px 50px rgba(0,0,0,.7),0 0 0 2px rgba(214,255,63,.35),0 0 46px rgba(214,255,63,.18)}
.ikon img{width:100%;height:100%;display:block}
.tx{flex:1;min-width:0}
.sav{display:inline-flex;align-items:stretch;transform:skewX(-12deg);box-shadow:0 20px 44px -14px #000}
.sav .tg{width:16px;background:#d6ff3f}
.sav .bd{padding:4px 30px 10px 22px;background:linear-gradient(100deg,#0f2b37,#06141a)}
.sav b{display:block;transform:skewX(12deg);font-family:"Exo2Cim",sans-serif;font-size:104px;line-height:1;color:#eaf6f4;
  letter-spacing:-.5px;text-shadow:0 0 34px rgba(150,236,255,.3)}
/* A TÖRÉS KÉZI: a két sor egy-egy teljes gondolat (lásd a régi lap
   megjegyzését) — a `nowrap` sorokkal a böngésző nem tördel rossz helyen. */
.alcim{margin-top:22px;font-family:"Exo2",sans-serif;font-weight:700;font-size:25px;line-height:1.36;color:#d8ecea}
.alcim span{display:block;white-space:nowrap}
.alcim b{color:#d6ff3f;font-weight:800}
.also{position:absolute;left:84px;bottom:30px;display:flex;gap:28px;
  font-family:"Exo2",sans-serif;font-weight:700;font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:#a3bdc1}
.also span{display:flex;align-items:center;gap:10px}
.also i{width:10px;height:10px;border-radius:50%;background:#3ee08f;flex:none}
.also span:nth-child(2) i{background:#d6ff3f}
.also span:nth-child(3) i{background:#62c4ff}
</style></head>
<body>
<div class="g">
  <div class="gyep"><svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#0d3a2c"/>
    <g fill="#114434"><rect x="0" width="15" height="200"/><rect x="30" width="15" height="200"/><rect x="60" width="15" height="200"/><rect x="90" width="15" height="200"/><rect x="120" width="15" height="200"/><rect x="150" width="15" height="200"/><rect x="180" width="15" height="200"/><rect x="210" width="15" height="200"/><rect x="240" width="15" height="200"/><rect x="270" width="15" height="200"/></g>
    <g fill="none" stroke="rgba(226,246,240,.6)" stroke-width="1.4"><path d="M10 6H290V194H10Z"/><path d="M10 100H290"/><circle cx="150" cy="100" r="30"/><path d="M95 6V44H205V6"/><path d="M95 194V156H205V194"/></g></svg></div>
  <div class="kup b"></div><div class="kup j"></div>
  <div class="lamp b"><i></i><i></i><i></i><i></i></div><div class="lamp j"><i></i><i></i><i></i><i></i></div>
  <div class="tart">
    <div class="ikon"><img src="../../icons/icon-512x512.png" alt=""></div>
    <div class="tx">
      <div class="sav"><span class="tg"></span><span class="bd"><b>MAGYAH</b></span></div>
      <div class="alcim"><span>Építsd a saját <b>magyah</b> csapatod, pörögj fel!</span><span>Vár a <b>mennyei megyei</b> edzők világa.</span></div>
    </div>
  </div>
  <div class="also">
    <span><i></i>Hat osztály</span>
    <span><i></i>Harminc forduló</span>
    <span><i></i>Offline is</span>
  </div>
</div>
</body></html>
