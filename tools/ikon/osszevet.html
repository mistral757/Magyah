<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>ikon — előtte / utána</title>
<!-- ELŐTTE / UTÁNA (1.0.11.2.01): a régi (tools/ikon/regi/) és az új (icons/)
     készlet, ugyanazokon a méreteken és háttereken.
     Renderelés: node tools/ikon/osszevet.js → docs/kepek/ikon-1-0-11-2-01.jpg -->
<style>
 body{margin:0;background:#202329;color:#e8e3d8;font:13px/1.4 system-ui,sans-serif;padding:20px;width:1160px}
 h2{font:700 15px/1 system-ui;margin:18px 0 10px;color:#d7c07a;letter-spacing:.06em;text-transform:uppercase}
 .ket{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;align-items:center}
 .ket>b{font-size:13px;color:#aab}
 .sor{display:flex;align-items:flex-end;gap:16px;padding:12px;border-radius:10px}
 .v{background:#f3f1ec}.s{background:#121316}
 img{display:block}
 .px img{image-rendering:pixelated}
 small{display:block;text-align:center;color:#8a8f99;font-size:10px;margin-top:3px}
 .kep{display:grid;grid-template-columns:repeat(5,76px);gap:22px 18px;padding:22px;border-radius:22px;
   background:linear-gradient(160deg,#3a4a6b,#1d2333 60%,#2d1f33)}
 .kep div{text-align:center;color:#fff;font-size:11px}
 .kep i{display:block;width:60px;height:60px;margin:0 auto 5px;border-radius:15px;background:#5d6577}
 .kep img{width:60px;height:60px;margin:0 auto 5px}
 .mask{border-radius:50%;overflow:hidden;width:120px;height:120px}
 .mask img{width:120px;height:120px}
</style></head><body>
<div id="a"></div>
<script>
const KESZ=[["Előtte","/tools/ikon/regi/"],["Utána","/icons/"]];
const N=[256,192,96,72,48,32,16];
let h="";
h+="<h2>Méretek — világos és sötét háttéren</h2><div class='ket'>";
for(const [n,d] of KESZ)for(const bg of ["v","s"])
  h+=`<b>${n} · ${bg==="v"?"világos":"sötét"}</b><div class="sor ${bg}">`+N.map(m=>`<div><img src="${d}icon-${m===256?512:m}x${m===256?512:m}.png" width="${m}" height="${m}"><small>${m}</small></div>`).join("")+"</div>";
h+="</div><h2>A kicsik natívan, pixelre nagyítva (×4) · maskable</h2><div class='ket'>";
for(const [n,d] of KESZ)h+=`<b>${n}</b><div class="sor s px">`+[48,32,16].map(m=>`<div><img src="${d}icon-${m}x${m}.png" width="${m*4}" height="${m*4}"><small>${m} px ×4</small></div>`).join("")
  +`<div><div class="mask"><img src="${d}icon-maskable-512x512.png"></div><small>maskable, körre vágva</small></div></div>`;
h+="</div><h2>Egy telefon kezdőképernyőjén</h2><div class='ket'>";
for(const [n,d] of KESZ)h+=`<b>${n}</b><div class="kep">`+["Naptár","Térkép","Zene","","Fotók","Óra","Időjárás","Posta","Hírek","Bolt"].map((x,i)=>
  i===3?`<div><img src="${d}icon-192x192.png">MAGYAH</div>`:`<div><i></i>${x}</div>`).join("")+"</div>";
h+="</div>";
a.innerHTML=h;
</script></body></html>
