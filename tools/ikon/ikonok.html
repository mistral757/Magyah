<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<title>MAGYAH — ikontervek</title>
<style>
  @font-face{font-family:'Anton';src:url('/fonts/anton-latin.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'Archivo Black';src:url('/fonts/archivo-black-latin.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'Oswald';src:url('/fonts/oswald-latin.woff2') format('woff2');font-weight:400 700;font-display:block}
  body{margin:0;background:#20242b;color:#e8e3d8;font:13px/1.5 system-ui,sans-serif;padding:26px 20px 40px}
  h1{font:700 17px/1.2 system-ui;margin:0 0 4px;letter-spacing:.02em}
  .sub{color:#9aa0aa;margin:0 0 26px;font-size:12.5px}
  .sor{display:flex;align-items:flex-end;gap:22px;margin:0 0 10px}
  .cim{font:700 13px/1.2 system-ui;letter-spacing:.06em;text-transform:uppercase;color:#d7c07a;margin:26px 0 10px}
  .leir{color:#9aa0aa;margin:-6px 0 12px;max-width:660px;font-size:12.5px}
  .cell{text-align:center}
  .cell small{display:block;color:#7d838d;margin-top:6px;font-size:11px;letter-spacing:.04em}
  .maszk{position:relative}
  /* A maskable BIZTONSÁGI ZÓNA: az Android launcher körre/squircle-re vágja az
     ikont, és csak a középső 80% átmérőjű KÖR marad garantáltan látható. */
  .maszk::after{content:"";position:absolute;inset:10%;border:2px dashed #e06a6a;border-radius:50%;pointer-events:none}
  .lab{color:#7d838d;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 6px}
</style></head><body>
<h1>MAGYAH — ikontervek</h1>
<p class="sub">Három irány. Mindegyikből eltűnt a felismerhető alak, a három csík és a „30-0”.
A piros szaggatott kör a maskable biztonsági zóna: azon kívülre a launcher belevághat.</p>
<div id="ki"></div>
<script>
const CREAM="#F2EDE1", INK="#1B1815", GOLD="#C9A227", HALV="#8C8578";

/* ── egy szabályos labda: sötét kör, világos ötszög, öt varrat ─────────────── */
function labda(cx,cy,r,fo,vi){
  const P=[], K=[];
  for(let i=0;i<5;i++){
    const a=(-90+i*72)*Math.PI/180, pr=r*0.42;
    P.push([cx+pr*Math.cos(a), cy+pr*Math.sin(a)]);
    const b=(-90+i*72+36)*Math.PI/180;
    K.push([cx+pr*0.95*Math.cos(b), cy+pr*0.95*Math.sin(b),
            cx+r*0.99*Math.cos(b),  cy+r*0.99*Math.sin(b)]);
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fo}"/>`
    + `<polygon points="${P.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="${vi}"/>`
    + K.map(([x1,y1,x2,y2])=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${vi}" stroke-width="${r*0.15}" stroke-linecap="round"/>`).join("");
}
/* ── sebességvonalak: hátrafelé keskenyedő ívek ───────────────────────────── */
function ivek(x,y,r,szin){
  return [0,1,2].map(i=>{
    const dy=(i-1)*r*0.72, h=r*(2.5-i*0.55), v=r*(0.30-i*0.06);
    return `<path d="M${x-r*0.9} ${y+dy} h-${h}" stroke="${szin}" stroke-width="${v}" stroke-linecap="round" fill="none" opacity="${0.95-i*0.22}"/>`;
  }).join("");
}
const keret=(bg)=>`<rect width="512" height="512" rx="112" fill="${bg}"/>`;

/* ══ A — KIRÚGÁS ═══════════════════════════════════════════════════════════ */
const A = keret(CREAM)
  + `<text x="256" y="196" text-anchor="middle" font-family="Anton" font-size="104" letter-spacing="2" fill="${INK}">MAGYAH</text>`
  + `<rect x="196" y="226" width="120" height="9" rx="4.5" fill="${GOLD}"/>`
  + ivek(330,360,62,INK) + labda(330,360,62,INK,CREAM);

/* ══ B — MONOGRAM ══════════════════════════════════════════════════════════ */
const B = keret(CREAM)
  + `<text x="248" y="352" text-anchor="middle" font-family="Anton" font-size="330" fill="${INK}">M</text>`
  + `<path d="M120 400 Q250 452 372 372" stroke="${GOLD}" stroke-width="17" fill="none" stroke-linecap="round"/>`
  + labda(392,344,44,INK,CREAM)
  + `<text x="256" y="466" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="50" letter-spacing="7" fill="${HALV}">MAGYAH</text>`;

/* ══ C — KEZDŐKÖR ══════════════════════════════════════════════════════════ */
const C = keret(CREAM)
  + `<line x1="256" y1="150" x2="256" y2="470" stroke="${INK}" stroke-width="13" opacity=".22"/>`
  + `<circle cx="256" cy="322" r="118" fill="none" stroke="${INK}" stroke-width="22"/>`
  + labda(256,322,50,INK,CREAM)
  + `<text x="256" y="140" text-anchor="middle" font-family="Anton" font-size="96" letter-spacing="2" fill="${INK}">MAGYAH</text>`
  + `<circle cx="256" cy="176" r="9" fill="${GOLD}"/>`;

const TERV=[
 ["A — Kirúgás","A mai ikon egyenes utódja: ugyanaz a szótípus, ugyanaz a rend, csak az alak helyén most a labda és a becsapódás vonala áll. Ez a legkevésbé kockázatos váltás — aki ismeri a mostanit, ugyanazt fogja látni."],
 ["B — Monogram","Egyetlen betűforma uralja, ezért ez olvas a legjobban 48 pixelen. A labda röppályája az M lábából indul. A szóvédjegy alul, halványan — ha elmosódik, az ikon akkor is működik."],
 ["C — Kezdőkör","A legtisztább és a legmárkásabb: a kezdőkör és a felezővonal absztrakt jele, középen a labdával. Nulla emberábrázolás, nulla idegen jelzés, és a lap arany pont-motívuma is visszaköszön benne."]
];
const SVG=[A,B,C];
const MERET=[512,192,96,48];
let h="";
SVG.forEach((s,i)=>{
  h+=`<div class="cim">${TERV[i][0]}</div><div class="leir">${TERV[i][1]}</div><div class="sor">`;
  MERET.forEach(m=>{
    h+=`<div class="cell"><svg width="${m}" height="${m}" viewBox="0 0 512 512">${s}</svg><small>${m}px</small></div>`;});
  h+=`<div class="cell maszk"><svg width="192" height="192" viewBox="0 0 512 512">${s}</svg><small>maskable</small></div>`;
  h+=`</div>`;
});
document.getElementById("ki").innerHTML=h;
</script>
</body></html>
