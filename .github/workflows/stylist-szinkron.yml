# 🌍 A közös kinézet-lista (stylist-mód) napi beépítése a Firebase-ből az index.html-be.
# Részletek: tools/stylist/beepit.js és docs/arc-stylist-3-9-315.md.
# Titok: FIREBASE_SERVICE_ACCOUNT — ugyanaz, mint a mérési szinkroné.
name: Stylist-lista beépítése

on:
  schedule:
    - cron: "53 3 * * *"   # naponta 03:53 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stylist-szinkron
  cancel-in-progress: false

jobs:
  beepites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lehúzás, szűrés, beépítés
        id: beepit
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Hiányzik a FIREBASE_SERVICE_ACCOUNT titok (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node tools/stylist/beepit.js --html index.html

      - name: Commit
        if: steps.beepit.outputs.valtozas == '1'
        env:
          UZENET: ${{ steps.beepit.outputs.uzenet }}
        run: |
          git config user.name "stylist-szinkron[bot]"
          git config user.email "stylist-szinkron@users.noreply.github.com"
          git add index.html
          git commit --quiet -m "$UZENET"
          git push --quiet
